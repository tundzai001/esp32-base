sonar.sources=src,include,docs,.github
sonar.tests=test,docs/test_render_catalogues.py
sonar.exclusions=docs/test_render_catalogues.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverageReportPaths=cpp-coverage.xml

sonar.issue.ignore.multicriteria=globalvarsrc,globalvarinc,voidparamsrc,voidparaminc
sonar.issue.ignore.multicriteria.globalvarsrc.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.globalvarsrc.resourceKey=**/*.cpp
sonar.issue.ignore.multicriteria.globalvarinc.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.globalvarinc.resourceKey=**/*.h

sonar.issue.ignore.multicriteria.voidparamsrc.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.voidparamsrc.resourceKey=**/*.cpp
sonar.issue.ignore.multicriteria.voidparaminc.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.voidparaminc.resourceKey=**/*.h